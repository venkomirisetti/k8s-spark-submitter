suite: Test submitter service account

templates:
  - templates/serviceaccount.yaml

release:
  name: spark-submitter
  namespace: spark-submitter

tests:
  - it: Should render service account when create is true
    set:
      serviceAccount:
        create: true
    asserts:
      - containsDocument:
          apiVersion: v1
          kind: ServiceAccount
          name: spark-submitter

  - it: Should not render service account when create is false
    set:
      serviceAccount:
        create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: Should use custom name when specified
    set:
      serviceAccount:
        create: true
        name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: Should add extra annotations
    set:
      serviceAccount:
        create: true
        annotations:
          key1: value1
          key2: value2
    asserts:
      - equal:
          path: metadata.annotations.key1
          value: value1
      - equal:
          path: metadata.annotations.key2
          value: value2
