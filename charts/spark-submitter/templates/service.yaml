apiVersion: v1
kind: Service
metadata:
  name: {{ include "spark-submitter.serviceName" . }}
  labels:
    {{- include "spark-submitter.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "spark-submitter.selectorLabels" . | nindent 4 }}
  ports:
  - port: {{ .Values.port }}
    targetPort: {{ include "spark-submitter.scheme" . | quote }}
    name: {{ include "spark-submitter.scheme" . }}
