sonar.projectKey=k8s-spark-submitter
sonar.projectName=k8s-spark-submitter
sonar.sources=.
sonar.inclusions=spark-*/src/main/scala/**
sonar.tests=.
sonar.test.inclusions=spark-*/src/test/scala/**
sonar.exclusions=**/target/**
sonar.coverage.jacoco.xmlReportPaths=spark-*/target/site/jacoco/jacoco.xml
sonar.scala.scalatest.reportPaths=spark-3.5/target/surefire-reports,spark-4.0/target/surefire-reports

sonar.coverage.exclusions=\
    **/SparkSubmitServer.scala,\
    **/K8sSparkSubmitArgsParser.scala,\
    **/KubernetesClientProvider.scala,\
    **/Constants.scala,\
    **/ServerConfig.scala,\
    **/SparkSubmitException.scala,\
    **/model/*.scala
