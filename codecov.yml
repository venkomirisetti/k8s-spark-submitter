coverage:
  status:
    project:
      default:
        target: 80%
        informational: true
    patch:
      default:
        target: 80%
        informational: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default

# Same files as sonar.coverage.exclusions in sonar-project.properties
ignore:
  - "**/SparkSubmitServer.scala"
  - "**/K8sSparkSubmitArgsParser.scala"
  - "**/KubernetesClientProvider.scala"
  - "**/Constants.scala"
  - "**/ServerConfig.scala"
  - "**/SparkSubmitException.scala"
  - "**/model/*.scala"
