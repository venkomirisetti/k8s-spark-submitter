name: Release

on:
  push:
    branches: [main]

env:
  DOCKER_REPO: venkomirisetti/k8s-spark-submitter

jobs:
  unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [spark-3.5, spark-4.0]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "17"
          cache: maven

      - name: Build and test
        run: ./mvnw -f ${{ matrix.module }}/pom.xml clean verify

  docker-push:
    runs-on: ubuntu-latest
    needs: unit-test
    strategy:
      matrix:
        module: [spark-3.5, spark-4.0]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "17"
          cache: maven

      - name: Build JAR
        run: ./mvnw -f ${{ matrix.module }}/pom.xml clean package -DskipTests -Dmaven.test.skip=true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SPARK_MODULE: ${{ matrix.module }}
        run: |
          SPARK_VERSION=$(make -s print-spark-version)
          make image-only IMAGE_TAG="${DOCKER_REPO}:${SPARK_VERSION}-${BUILD_NUMBER}"
          SPARK_LINE="${SPARK_MODULE#spark-}"
          docker tag "${DOCKER_REPO}:${SPARK_VERSION}-${BUILD_NUMBER}" "${DOCKER_REPO}:${SPARK_VERSION}-latest"
          docker tag "${DOCKER_REPO}:${SPARK_VERSION}-${BUILD_NUMBER}" "${DOCKER_REPO}:${SPARK_LINE}-${BUILD_NUMBER}"
          docker tag "${DOCKER_REPO}:${SPARK_VERSION}-${BUILD_NUMBER}" "${DOCKER_REPO}:${SPARK_LINE}-latest"
          docker push "${DOCKER_REPO}:${SPARK_VERSION}-${BUILD_NUMBER}"
          docker push "${DOCKER_REPO}:${SPARK_VERSION}-latest"
          docker push "${DOCKER_REPO}:${SPARK_LINE}-${BUILD_NUMBER}"
          docker push "${DOCKER_REPO}:${SPARK_LINE}-latest"
