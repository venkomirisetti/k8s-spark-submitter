name: Release

on:
  push:
    branches: [main]

env:
  DOCKER_REPO: venkomirisetti/k8s-spark-submitter
  SPARK_VERSION: "4.0.1"

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: maven

      - name: Build and test
        run: ./mvnw clean verify

  docker-push:
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: maven

      - name: Build JAR
        run: ./mvnw clean package -DskipTests -Dmaven.test.skip=true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          make image-only IMAGE_TAG="${DOCKER_REPO}:${SPARK_VERSION}-${BUILD_NUMBER}"
          docker tag "${DOCKER_REPO}:${SPARK_VERSION}-${BUILD_NUMBER}" "${DOCKER_REPO}:${SPARK_VERSION}-latest"
          docker tag "${DOCKER_REPO}:${SPARK_VERSION}-${BUILD_NUMBER}" "${DOCKER_REPO}:latest"
          docker push "${DOCKER_REPO}:${SPARK_VERSION}-${BUILD_NUMBER}"
          docker push "${DOCKER_REPO}:${SPARK_VERSION}-latest"
          docker push "${DOCKER_REPO}:latest"
